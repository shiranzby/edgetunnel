name = "shyvpn-edgetunnel"
main = "worker.js"
compatibility_date = "2025-11-04"
keep_vars = false

[vars]
UUID = "<YOUR_UUID>"
ADMIN = "<YOUR_ADMIN_PASSWORD>"
HOST = "vpn.example.com"
SUB = "sub.cmliussss.workers.dev"
CFIP_DATA_URL = "https://raw.githubusercontent.com/shiranzby/edgetunnel/main/data/cfip.json"
# 物理移动 IPv4 对 shyvpn.cc.cd 的 TLS/SNI 会重置；使用已验证可握手的备用 SNI，HTTP Host 仍保持 HOST。
PROXY_SNI = "nps.shw.de5.net"
CFST_PANEL_URL = "https://test.example.com/"
DISABLE_LOGIN = "false"
DEBUG = "false"
SUBSCRIBE_ORIGIN = "https://vpn.example.com"

[[kv_namespaces]]
binding = "KV"
id = "<YOUR_KV_NAMESPACE_ID>"
